name: Prepare fuel calculator download
on:
  push:
    paths:
      - .github/workflows/prepare-fuel-calculator.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fuel-calculator
  cancel-in-progress: true
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cat fuelcalc-parts/part-*.txt | base64 -d > Fuel_Cost_Calculator.apk
            git add Fuel_Cost_Calculator.apk
            git diff --cached --quiet && exit 0
            git commit -m "Update fuel calculator download"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
