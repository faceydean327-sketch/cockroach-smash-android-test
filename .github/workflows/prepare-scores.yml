name: Prepare high scores download
on: [push, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: high-scores-game
  cancel-in-progress: true
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat scores-part-*.txt | base64 -d > Cockroach_Smash_High_Scores.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cockroach_Smash_High_Scores.apk
          git diff --cached --quiet || git commit -m "Add high scores game download"
          git push
