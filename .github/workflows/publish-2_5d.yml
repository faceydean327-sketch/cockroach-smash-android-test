name: Publish 2.5D APK
on:
  push:
    paths:
      - '.toqi-upload-2_5d/**'
      - '.github/workflows/publish-2_5d.yml'
permissions:
  contents: write
concurrency:
  group: publish-2_5d
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and commit actual APK binary
        run: |
          set -euo pipefail
          cat .toqi-upload-2_5d/part-*.txt | base64 --decode > Cockroach_Smash_2_5D.apk
          echo "e5ab9dede23d628cce2a81decf769a1b3f4357b27c55611e008e12b2cc91a516  Cockroach_Smash_2_5D.apk" | sha256sum --check -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .toqi-upload-2_5d .github/workflows/publish-2_5d.yml
          git add -- Cockroach_Smash_2_5D.apk
          git commit -m "Add 2.5D Android APK download"
          git push origin "HEAD:${GITHUB_REF_NAME}"
