name: Prepare Web Chat APK
on:
  push:
    paths:
      - webchat-part-*.txt
      - .github/workflows/prepare-web-chat.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the APK download
        run: |
          cat webchat-part-00.txt webchat-part-01.txt webchat-part-02.txt | base64 --decode > Web_Chat_Android_Test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web_Chat_Android_Test.apk
          git diff --cached --quiet || git commit -m "Add Web Chat Android download"
          git push
