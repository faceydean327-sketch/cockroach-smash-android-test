name: Prepare kitchen menu download
on: [push, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: kitchen-menu-game
  cancel-in-progress: true
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat kitchen-menu-part-*.txt | base64 -d > Cockroach_Smash_Kitchen_Menu.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cockroach_Smash_Kitchen_Menu.apk
          git diff --cached --quiet || git commit -m "Add kitchen menu game download"
          git push
