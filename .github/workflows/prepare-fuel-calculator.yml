name: Prepare fuel calculator download
on:
  push:
    paths:
      - fuelcalc-parts/**
      - .github/workflows/prepare-fuel-calculator.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat fuelcalc-parts/part-*.txt | base64 -d > Fuel_Cost_Calculator.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fuel_Cost_Calculator.apk
          git diff --cached --quiet || git commit -m "Add fuel calculator download"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
