name: Assemble 32-bit APK
on:
  push:
    paths:
      - '.github/workflows/assemble-roach32.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and publish
        run: |
          cat .roach32-stage/part*.txt | base64 -d > Roach_Simulator_3D_32bit.apk
          echo "022aba941c9da8ab676cd4a3e26d79cdfe364737930352e86ec648d362988590  Roach_Simulator_3D_32bit.apk" | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Roach_Simulator_3D_32bit.apk
          git rm -r .roach32-stage .github/workflows/assemble-roach32.yml
          git commit -m 'Publish 32-bit compatible Roach Simulator'
          git push
